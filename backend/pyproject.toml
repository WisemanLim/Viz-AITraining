[project]
name = "viz-ai-training-api"
version = "0.1.0"
description = "Viz-AITraining — FastAPI backend for ML/DL training visualization"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "onnx>=1.16",
  "python-multipart>=0.0.9",
  "minio>=7.2",
  "numpy>=2.0",
]

[project.optional-dependencies]
export = ["cairosvg>=2.7"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
