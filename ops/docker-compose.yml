# Viz-AITraining — docker-compose (infra + optional app profile)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viz}
      POSTGRES_DB: ${POSTGRES_DB:-viz_ai_training}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-viz}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Phase 2: TimescaleDB extension for metric time-series
  # timescaledb:
  #   image: timescale/timescaledb:latest-pg17
  #   ...

  api:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env.dev
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    working_dir: /app

volumes:
  pgdata:
  miniodata:
