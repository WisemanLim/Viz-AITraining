[project]
name = "vizaitrain"
version = "0.1.0"
description = "Viz-AITraining SDK — PyTorch SummaryWriter-compatible training logger"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
ml = ["torch>=2.0"]
sklearn = ["scikit-learn>=1.4"]
xai = ["scikit-learn>=1.4", "shap>=0.44", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["vizaitrain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
